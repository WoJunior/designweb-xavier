<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.2/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
</head>
<body class="flex h-screen">
    
    <div class="m-auto" x-data="{ condicao: true, spoiler: false }">
        
        <button class="btn" @click="condicao = !condicao, spoiler = !spoiler" x-text="condicao ? 'Ver Spoiler' : 'Fechar Spoiler'">
        </button>

        <p class="m-auto border text-center mt-4 rounded" x-show="spoiler">lorem ipsum</p>

    </div>

</body>
</html>
