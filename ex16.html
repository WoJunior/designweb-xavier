<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.2/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
</head>
<body class="flex h-screen">
    
    <div class="m-auto border-2 border-slate-400 rounded-xl" x-data="{ tab: null }">
        
        <section class="tabs tabs-border border-2 border-slate-400 rounded-lg">
            <button class="tab" @click="tab = 1">Tab 1</button>
            <button class="tab" @click="tab = 2">Tab 2</button>
            <button class="tab" @click="tab = 3">Tab 3</button>
        </section>

        <section class="text-center mt-2 pt-4 pb-8">
            <div x-show="tab == 1">
                Conteúdo do tab 1
            </div>

            <div x-show="tab == 2">
                Conteúdo do tab 2
            </div>

            <div x-show="tab == 3">
                Conteúdo do tab 3
            </div>
        </section>
    </div>

</body>
</html>
