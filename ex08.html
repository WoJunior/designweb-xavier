<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.2/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex h-screen">
    
    <div class="flex flex-col m-auto p-4 border gap-2 rounded-xl" x-data="{ count: 0 } ">

        <span x-text="count" class="m-auto text-3xl"></span>

        <section>
            <button @click="count++" class="btn mb-4 pb-1 text-2xl">+</button>
            <button @click="count--" class="btn mb-4 pb-1 text-3xl">-</button>
            <button @click="count = 0" class="btn mb-4 pb-1 text-xl">Reset</button>
        </section>

    </div>

</body>
</html>
