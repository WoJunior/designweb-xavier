<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abas com Transição (sem JS)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-6 rounded-xl shadow-md text-center w-84">
  <h2 class="text-lg font-semibold mb-4">Quantidade de créditos para compra</h2>
  
  <div class="flex items-center justify-center gap-6">
    <!-- Botão de diminuir -->
    <button class="text-2xl pb-2 text-blue-600 border-2 border-blue-300 rounded-full w-10 h-10 items-center justify-center hover:bg-blue-50">
      –
    </button>

    <!-- Valor fixo -->
    <section>
      <span class="text-4xl font-bold text-gray-800 select-none">100</span>
      <input class="w-full border-b bg-white focus:outline-none" disabled>
    </section>
    <!-- Botão de aumentar -->
    <button class="text-2xl pb-2 text-blue-600 border-2 border-blue-300 rounded-full w-10 h-10 flex items-center justify-center hover:bg-blue-50">
      +
    </button>
  </div>

</div>

</body>
</html>
