<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.2/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="flex h-screen w-full">

    <div class="text-center h-full w-full" x-data="{ show: false }">

        <button @click="show = !show" x-show="show == false" class="m-auto">Abrir Modal</button>


        <div x-show="show == true" class="bg-slate-900 h-full w-full">
            <button @click="show = !show" class="m-auto text-white">Fechar Modal</button>
        </div>

    </div>

</body>

</html>
